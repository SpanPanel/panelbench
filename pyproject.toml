[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "span-panel-simulator"
version = "1.0.11"
description = "Standalone eBus simulator for SPAN panels"
requires-python = ">=3.14"
dependencies = [
    "aiomqtt>=2.0.0",
    "aiohttp>=3.9.0",
    "aiohttp-jinja2>=1.6",
    "jinja2>=3.1.0",
    "cryptography>=42.0.0",
    "pyyaml>=6.0",
    "zeroconf>=0.131.0",
    "timezonefinder>=6.0",
]

# `ebus-emitter` is a runtime dependency but is not listed here because it is not on
# PyPI and its checkout location varies per developer. Run `scripts/dev-setup.sh`
# (which reads `.env` for `EBUS_EMITTER_PATH`) to install it editable into the venv.
# See `.env.example` for the expected variable.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.15.0",
    "mypy>=1.10",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
]

[project.scripts]
span-simulator = "span_panel_simulator.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/span_panel_simulator"]

[tool.hatch.build.targets.wheel.force-include]
"src/span_panel_simulator/dashboard/templates" = "span_panel_simulator/dashboard/templates"
"src/span_panel_simulator/dashboard/static" = "span_panel_simulator/dashboard/static"

[tool.ruff]
target-version = "py314"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "RUF"]
# TC002 (move third-party import into TYPE_CHECKING) conflicts with mypy's need for runtime
# resolution of imported names referenced from generic functions/methods. Disable to allow
# straightforward runtime imports.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = "timezonefinder"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ebus_emitter"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ebus_emitter.*"
ignore_missing_imports = true

# CloneRuntime is defined in runtime.py, but setter_handlers references it through a
# TYPE_CHECKING import. mypy under --strict still complains about the forward ref when
# runtime.py hasn't been written; relax for the emitter_adapter subpackage during the
# integration build-out.
