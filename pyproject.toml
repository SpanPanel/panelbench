[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "span-panel-simulator"
version = "1.0.12"
description = "Standalone eBus simulator for SPAN panels"
requires-python = ">=3.14"
dependencies = [
    "aiomqtt>=2.0.0",
    "aiohttp>=3.9.0",
    "aiohttp-jinja2>=1.6",
    "jinja2>=3.1.0",
    "cryptography>=42.0.0",
    "pyyaml>=6.0",
    "zeroconf>=0.131.0",
    "timezonefinder>=6.0",
]

# `ebus-emitter` is a runtime dependency but is not listed here because it is not on
# PyPI and its checkout location varies per developer. Run `scripts/dev-setup.sh`
# (which reads `.env` for `EBUS_EMITTER_PATH`) to install it editable into the venv.
# See `.env.example` for the expected variable.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.15.0",
    "mypy>=1.10",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
    "amqtt>=0.11.3",
]

[project.scripts]
span-simulator = "span_panel_simulator.__main__:main"

[tool.hatch.build.targets.wheel]
# `packages` already ships every file under src/span_panel_simulator, including
# dashboard/templates and dashboard/static. A `force-include` table re-adding
# those two directories at the same destination paths made hatchling write each
# file twice; newer hatchling rejects that outright ("A second file is being
# added to the wheel archive at the same path"), breaking `pip install .` in the
# add-on Docker build. Build isolation resolves `hatchling` fresh on every build,
# so the older, tolerant version this was authored against is not coming back.
packages = ["src/span_panel_simulator"]

[tool.ruff]
# Pinned to py313 because ruff 0.15.x has a formatter bug under py314 that
# rewrites ``except (A, B):`` into the Python-2 ``except A, B:`` syntax.
# Bump back to py314 once the upstream bug is fixed.
target-version = "py313"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "RUF"]
# TC002 (move third-party import into TYPE_CHECKING) conflicts with mypy's need for runtime
# resolution of imported names referenced from generic functions/methods. Disable to allow
# straightforward runtime imports.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = "timezonefinder"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ebus_emitter"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ebus_emitter.*"
ignore_missing_imports = true

# CloneRuntime is defined in runtime.py, but setter_handlers references it through a
# TYPE_CHECKING import. mypy under --strict still complains about the forward ref when
# runtime.py hasn't been written; relax for the emitter_adapter subpackage during the
# integration build-out.
