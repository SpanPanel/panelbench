[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panelbench"
version = "2.0.0"
description = "Standalone eBus simulator for SPAN panels"
requires-python = ">=3.14"
dependencies = [
    "aiomqtt>=2.0.0",
    "aiohttp>=3.9.0",
    "aiohttp-jinja2>=1.6",
    "jinja2>=3.1.0",
    "cryptography>=42.0.0",
    "pyyaml>=6.0",
    "zeroconf>=0.131.0",
    "timezonefinder>=6.0",
    # The eBus emitter, and what it runs on.
    #
    # `ebus-panel-sim` is a RUNTIME dependency, not a dev one: `app.py` imports
    # `panelbench.emitter_adapter.runtime`, which imports `Emitter`,
    # `MqttDeviceTransport` and eight more names from `ebus_panel_sim` at module
    # scope. It sat in the dev group while the emitter was vendored under
    # `src/panelbench/ebus_emitter/` and nothing needed to resolve it; de-vendoring
    # made the group wrong without making any test fail, because the dev group is
    # exactly what a test run installs. The add-on image builds with
    # `pip install .`, which installs this list and no groups, so it failed on
    # `import panelbench.app` with `ModuleNotFoundError: ebus_panel_sim`.
    #
    # ebus-sdk carries the parent/child device tree the panel/child schema requires.
    # `graph_builder` targets the tree API (`parent=<Device>`, no
    # `children_ids`/`root_id`/`parent_id`, no `Device.add_child()`), and this simulator owns
    # the broker connection outright — the SDK device tree is a naming and description model,
    # and our own client publishes.
    #
    # The tree is built TRANSPORT-FREE: no `mqtt_cfg` is passed, so the SDK opens no socket
    # and the whole tree still composes. That has been the documented behaviour since 0.14.0
    # (our GH #9 / PR #10); the two-step client-neutralisation workaround this file used to
    # describe is gone, not rewritten.
    #
    # Pinned exactly, not ranged, so upgrades stay deliberate: the add-on image installs
    # from this file rather than the lockfile, so the declared pin is the operative control
    # in production. On any bump, re-check the `homie` logger premise documented in
    # `__main__.py` — 0.18.0 logs a missing client at `debug` when the tree is transport-free
    # (our GH #11 / PR #20), which is exactly our case. Re-checked at 0.19.0: `setLevel` and
    # `pformat` are both still absent from `homie.py` and the logger is still NOTSET at
    # import, so the filter remains a guard rather than a live need.
    "ebus-sdk==0.19.0",
    "ebus-panel-sim",
    "paho-mqtt>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.15.0",
    "mypy>=1.10",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
    "amqtt>=0.11.3",
]

[project.scripts]
panelbench = "panelbench.__main__:main"

[tool.hatch.build.targets.wheel]
# `packages` already ships every file under src/panelbench, including
# dashboard/templates and dashboard/static. A `force-include` table re-adding
# those two directories at the same destination paths made hatchling write each
# file twice; newer hatchling rejects that outright ("A second file is being
# added to the wheel archive at the same path"), breaking `pip install .` in the
# add-on Docker build. Build isolation resolves `hatchling` fresh on every build,
# so the older, tolerant version this was authored against is not coming back.
#
# The same applies to the vendored emitter's data files
# (`ebus_emitter/wire/profiles/*.json`, `ebus_emitter/wire/mapping/*.yaml`): they live
# under `src/panelbench`, so `packages` already ships them. Upstream declared
# them via `force-include` because its package root was elsewhere; re-adding that here
# would reintroduce the duplicate-path collision described above.
packages = ["src/panelbench"]

[tool.ruff]
# Pinned to py313 because ruff 0.15.x has a formatter bug under py314 that
# rewrites ``except (A, B):`` into the Python-2 ``except A, B:`` syntax.
# Bump back to py314 once the upstream bug is fixed.
target-version = "py313"
line-length = 99
# Byte-vendored from the eBus emitter as the fidelity reference (see
# tests/fidelity/fixtures/upstream/PROVENANCE.md). Reformatting it to our rules
# would destroy the property that makes it useful -- that it is upstream's file,
# unmodified -- and would make every re-sync a merge conflict.
extend-exclude = ["tests/fidelity/fixtures/upstream"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "RUF"]
# TC001/TC002/TC003 (move imports into TYPE_CHECKING blocks) conflict with mypy's need for
# runtime resolution of imported names referenced from generic functions/methods. Disable to
# allow straightforward runtime imports.
#
# This ignore was previously described by this comment but never actually declared — none of
# the simulator's own modules happened to trigger the rules, so the omission was invisible.
# The vendored emitter does trigger them, and was authored under an identical select
# list plus this same ignore, so declaring it here restores the intent rather than relaxing
# the bar for vendored code.
ignore = ["TC001", "TC002", "TC003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
# Same reason as ruff's exclusion: the vendored reference is upstream's code held
# byte-identical, not ours to annotate. It is exercised by the parity test, which
# is a stronger check than type-checking it would be.
exclude = ["tests/fidelity/fixtures/upstream/"]

[[tool.mypy.overrides]]
module = "timezonefinder"
ignore_missing_imports = true

[tool.uv.sources]
# spanpanel/main is the fork's integration branch: an upstream release tag, plus
# only the fixes upstream has not taken yet. It sat on our own unmerged PR branch
# until upstream released 0.4.0 carrying it; rebasing onto the tag dropped the
# stack, so the delta from a release is now two commits and readable as a diff.
#
# Prefer a release here the moment one carries what we need. It does not yet:
# PyPI 0.4.0 still publishes grid/grid-forming-entity as the class name "BESS"
# rather than a device id, measured against the released wheel and against this
# suite (pin 0.4.0 and tests/fidelity/test_islanded_wire.py fails, alone). When
# that fix lands upstream, drop this source override rather than bumping the rev.
#
# Pinning a *review* branch instead once left the lock on a mid-review commit for
# days, missing API this repo had already started calling.
ebus-panel-sim = { git = "https://github.com/SpanPanel/distribution-enclosure-simulator.git", rev = "spanpanel/main" }

# CloneRuntime is defined in runtime.py, but setter_handlers references it through a
# TYPE_CHECKING import. mypy under --strict still complains about the forward ref when
# runtime.py hasn't been written; relax for the emitter_adapter subpackage during the
# integration build-out.
