# The panels rigs.sh runs side by side from this checkout, one per line:
# "<slot> <config>".
#
# <slot>    a digit 0-9 that sets the panel's ports: HTTP_PORT 2808N (https on
#           2908N), DASHBOARD_PORT 2818N and BROKER_PORT 2888N for run-local.sh
# <config>  a YAML file in the config directory, run-local.sh's CONFIG_NAME
#
# Home Assistant knows each panel by its host and http port, so a panel keeps its
# slot.
#
# The ref_* templates are built at every start from the reference
# captures the pinned ebus-panel-sim ships. main32_issue269.yaml is kept by hand in
# the config directory.

