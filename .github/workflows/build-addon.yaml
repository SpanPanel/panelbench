name: Build HA Add-on Image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "mosquitto/**"
      - "panelbench/**"
      - "pyproject.toml"
      - ".github/workflows/build-addon.yaml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base-python:3.14-alpine3.23
          - arch: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base-python:3.14-alpine3.23

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract version from config.yaml
        id: version
        run: |
          version=$(grep '^version:' panelbench/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # `:latest` is what an unversioned pull gets, so only main moves it. A build
      # dispatched from any other ref, a pre-release branch above all, publishes its
      # version tag alone.
      #
      # That version tag is what an installed add-on pulls, so only main may build a
      # stable version. A pre-release branch is cut while config.yaml still names the
      # last release, and a dispatch from it before the bump would overwrite that
      # release's image under every installation; it is refused instead.
      - name: Check the version and choose image tags
        id: tags
        env:
          IMAGE: ${{ env.REGISTRY }}/spanpanel/panelbench/${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          stable='^[0-9]+\.[0-9]+\.[0-9]+$'
          prerelease='^[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$'
          if [[ ! "${VERSION}" =~ ${stable} && ! "${VERSION}" =~ ${prerelease} ]]; then
            echo "::error::panelbench/config.yaml declares version '${VERSION}', which is neither X.Y.Z nor a pre-release such as X.Y.ZbN."
            exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ] && [[ ! "${VERSION}" =~ ${prerelease} ]]; then
            echo "::error::${GITHUB_REF} declares the stable version ${VERSION}, which only main may build. Bump panelbench/config.yaml to a pre-release version such as X.Y.ZbN first."
            exit 1
          fi
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION}"
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: panelbench/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=${{ matrix.base }}
          tags: ${{ steps.tags.outputs.tags }}
