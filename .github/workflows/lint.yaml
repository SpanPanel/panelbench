name: Lint & Type Check

on:
  pull_request:
    branches: [main, "prerelease/**"]
  # Also on push, because pull_request alone leaves `main` unwatched. The mypy hook
  # was broken from the moment the emitter stopped being vendored and stayed broken
  # across several pushes, all of them reporting green — the only workflow running on
  # push was the add-on image build. The breakage surfaced on the next unrelated
  # dependabot PR, which is a confusing place to learn about it.
  push:
    branches: [main, "prerelease/**"]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # requires-python is >=3.14. The hooks run in environments of their own, which
      # is why 3.13 worked, but nothing should depend on that.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        run: pre-commit run --all-files
