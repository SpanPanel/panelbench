name: Tests

# Nothing ran the test suite in CI before this: `lint.yaml` runs pre-commit, whose
# mypy hook covers `src/panelbench` and not the tests. A regression in code the
# suite pins, the broker link above all, would have shipped green.
#
# mosquitto comes from apt so the real-broker tests in tests/integration run here.
# They skip where mosquitto is missing, which is right on a laptop and wrong here:
# PANELBENCH_REQUIRE_MOSQUITTO turns that skip into a failure, so a runner image
# that loses the package cannot pass by testing less.
#
# --locked, not --frozen: --frozen installs whatever uv.lock says even when
# pyproject.toml has moved on, so a dependency bound changed without a re-lock
# would be tested against the old resolution and pass. --locked fails instead.

on:
  pull_request:
    branches: [main, "prerelease/**"]
  push:
    branches: [main, "prerelease/**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The interpreter comes from .python-version, which matches requires-python.
      - uses: astral-sh/setup-uv@v7

      - name: Install mosquitto
        run: sudo apt-get update && sudo apt-get install -y mosquitto

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        env:
          PANELBENCH_REQUIRE_MOSQUITTO: "1"
        run: uv run --locked pytest -q -rs
