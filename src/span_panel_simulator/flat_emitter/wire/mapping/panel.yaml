entity_class: panel
profile: panel.json
profile_version: 1
placement:
  kind: root-device
  device_id_template: "{instance_id}"
wire:
  device_id_source: self
  property_path_template: "{capability}/{property_key}"
display:
  name_template: "{display_name}"
  fallback_name_template: "Panel {instance_id_short}"
discovery:
  $description_owner: self
  state_owner: self
