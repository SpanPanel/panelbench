repos:
  - repo: local
    hooks:
      - id: sync-version
        name: sync-version
        entry: scripts/sync-version.sh
        language: script
        files: '(pyproject\.toml|__init__\.py|config\.yaml|Dockerfile)$'
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: [--strict]
        additional_dependencies:
          # Matched to the runtime dependencies in pyproject.toml. The hook runs in its
          # own isolated environment, so anything missing here is not merely unchecked
          # — mypy reports `import-not-found` and the hook fails.
          #
          # `ebus-panel-sim` is listed because the emitter stopped being vendored. While
          # it lived at `src/panelbench/ebus_emitter` mypy resolved it as an in-repo
          # module and no entry was needed; the moment it became a dependency this hook
          # could no longer see it. That went unnoticed because `lint.yaml` runs on
          # `pull_request` only, so a push straight to `main` never exercises it.
          #
          # These mirror pyproject's pins exactly. A pin here that the runtime does not
          # share would type-check against code nobody runs, which is how `ebus-sdk`
          # drifted to 0.17.0 while the project had moved to 0.19.0. Both are now
          # released versions from PyPI rather than a git ref: `ebus-panel-sim` used to
          # track the fork's moving `spanpanel/main` branch, so this hook could resolve a
          # different build on two consecutive runs with nothing in the repo changing.
          - ebus-panel-sim==0.8.0
          - ebus-sdk==0.22.0
          - aiomqtt>=2.0.0
          - aiohttp>=3.9.0
          - aiohttp-jinja2>=1.6
          - jinja2>=3.1.0
          - cryptography>=42.0.0
          - pyyaml>=6.0
          - zeroconf>=0.131.0
          - types-PyYAML
          - types-aiofiles
        pass_filenames: false
        entry: mypy --strict src/panelbench

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
