# Simple test configuration with minimal circuits
# Includes solar + battery for basic DER testing

panel_config:
  serial_number: "sim-16t-001"
  total_tabs: 16
  main_size: 100
  # `status/wifi-ssid` is declared by the enclosure and read by consumers today,
  # as default_MAIN_40.yaml states at length; without a value it is an entity
  # that never resolves. Synthetic, so it attests the mapping and not what a real
  # network is called.
  wifi_ssid: sim-wifi
  latitude: 37.7
  longitude: -122.4

pv:
  # Identity only. There is no `enabled` key: the PV device is instantiated from the
  # producer circuit templates below, and this section fills in what r202633 documents
  # on its info node rather than changing whether it exists.
  #
  # `serial_number` is deliberately absent, as in default_MAIN_40.yaml:
  # `_der_identifier` prefers a serial over `instance_id`, so setting one moves the
  # device id from `<panel>-pv-1` to `<panel>-<serial>`.
  vendor: Enphase
  product_name: IQ8PLUS-72-2-US
  firmware_version: sim-pv/v0.1.0

bess:
  enabled: true
  # Identity, for the reason default_MAIN_40.yaml states at length: r202633 documents
  # these on the device's info node and the emitter passes them through, so leaving
  # them unset publishes a declaration with no value — an entity that never resolves
  # rather than one a user notices is missing. Synthetic, so they attest the mapping
  # and not what real firmware sends.
  #
  # The MID's own identity, not the battery's. This panel used to stand up no MID at
  # all -- the comment here said it "is not islandable", which was never a property of
  # the panel so much as of what the old gate happened to read. A commissioned battery
  # forms a premises island, so this panel publishes a MID like any other, and these
  # three are the device-registry row a consumer builds for it. Unvalued, that row
  # shows a blank model and no firmware. `serial-number` is absent on purpose: the
  # generator derives it as `<bess serial>-mid`, the resolvable link between the two
  # halves of one unit.
  #
  # `grid_forming` is deliberately NOT set here. It defaults to true for a
  # commissioned battery, and leaving it unstated is what keeps
  # test_every_shipped_config_with_a_battery_publishes_a_mid exercising that default
  # rather than a value typed beside it.
  mid_product_name: SPAN MID
  mid_firmware_version: sim-mid/v0.1.0
  mid_hardware_version: rev1
  vendor: Span
  product_name: SPAN Battery
  part_number: SPN-BESS-001
  serial_number: SIM-BESS-16T-001
  firmware_version: sim-bess/v0.1.0
  nameplate_capacity_kwh: 13.5
  max_charge_w: 3500.0
  max_discharge_w: 3500.0
  charge_efficiency: 0.95
  discharge_efficiency: 0.95
  backup_reserve_pct: 20.0
  charge_mode: self-consumption
  charge_hours: [8, 9, 10, 11, 12, 13, 14, 15]
  discharge_hours: [16, 17, 18, 19, 20, 21, 22]

circuit_templates:
  lighting:
    energy_profile:
      mode: "consumer"
      power_range: [5.0, 50.0]
      typical_power: 25.0
      power_variation: 0.1
    relay_behavior: "controllable"
    priority: "NEVER"
    breaker_rating: 15

  outlets:
    energy_profile:
      mode: "consumer"
      power_range: [0.0, 1800.0]
      typical_power: 150.0
      power_variation: 0.3
    relay_behavior: "controllable"
    priority: "NEVER"
    breaker_rating: 15

  hvac:
    energy_profile:
      mode: "consumer"
      power_range: [0.0, 3000.0]
      typical_power: 2000.0
      power_variation: 0.15
    relay_behavior: "controllable"
    priority: "OFF_GRID"
    breaker_rating: 30

  solar:
    energy_profile:
      mode: "producer"
      power_range: [-5000.0, 0.0]
      typical_power: -2500.0
      power_variation: 0.2
      efficiency: 0.85
      nameplate_capacity_w: 5000.0
    relay_behavior: "non-controllable"
    priority: "NEVER"
    device_type: "pv"
    breaker_rating: 30

circuits:
  - id: "living_room_lights"
    name: "Living Room Lights"
    template: "lighting"
    tabs: [1]

  - id: "kitchen_lights"
    name: "Kitchen Lights"
    template: "lighting"
    tabs: [2]

  - id: "kitchen_outlets"
    name: "Kitchen Outlets"
    template: "outlets"
    tabs: [3]

  - id: "bedroom_outlets"
    name: "Bedroom Outlets"
    template: "outlets"
    tabs: [4]

  - id: "main_hvac"
    name: "Main HVAC"
    template: "hvac"
    tabs: [5, 7]

  - id: "solar_inverter"
    name: "Solar Inverter"
    template: "solar"
    tabs: [6, 8]

unmapped_tabs: [9, 10, 11, 12, 13, 14, 15, 16]

simulation_params:
  update_interval: 5
  time_acceleration: 1.0
  noise_factor: 0.02
  enable_realistic_behaviors: true
