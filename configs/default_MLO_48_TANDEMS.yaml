# A 48-space main-lug-only panel on SPAN hardware 3.0, with tandem and quad breakers.
#
# Built from the pinned emitter's reference MLO 48 (`r202639-e`, which PanelBench also
# writes as `ref_MLO_48.yaml`) through PanelBench's own definition import, so it keeps
# that panel's shape: hardware 3.0, which selects the emitter's `span-alpha-test-b2`
# variant, its firmware release, no main breaker, its lugs, and each circuit's spaces,
# rating, priority and commissioned facts. Its serial, site, circuit names and load
# profiles are synthetic, and its energy registers start from PanelBench's estimate.
#
# Multi-load breakers. A MAIN 16, MLO 24, MAIN 40 or MLO 48 publishes one circuit per
# protected circuit (spanio/SPAN-API-Client-Docs#21). Each circuit on a breaker
# publishes its own `breaker/rating` and names all the others in `meter/` and
# `switch/shared-with-device-ids`, which `shared_with` sets, so each group is wired both
# ways. A single-pole circuit lists its own space and a two-pole one lists both:
#
#   space 37         15-20 tandem   Basement Outlets 20 A, Basement Lights 15 A
#   space 44         15-15 tandem   Guest Room Lights, Guest Room Outlets
#   space 46         20-20 tandem   Den Outlets, Den Lights
#   space 48         15-10 tandem   Dining Room Outlets 15 A, Dining Room Lights 10 A
#   spaces 27 + 29   quad           Mini-Split Heat Pump 2P 20 A, Well Pump 2P 30 A
#   spaces 31 + 33   tandem-quad    Workshop Outlets 20 A on 31, Workshop Lights 15 A
#                                   on 33, Air Compressor 2P 20 A on both
#
# The tandems at 44, 46 and 48 are the reference panel's own. The other three groups
# replace five of its lights-and-outlets circuits, since it has no free space. A
# breaker's circuits share one relay, so each group's have one relay behaviour and one
# priority. Each circuit models its own load here; on hardware every circuit on a
# breaker publishes that breaker's one combined reading, and once the emitter publishes
# it so, this template needs no change.

panel_config:
  serial_number: sim-48t-tandems-001
  total_tabs: 48
  # Main-lug-only: no main breaker, so the panel publishes no `breaker` node.
  main_size: null
  latitude: 37.7
  longitude: -122.4
  display_name: SPAN Panel eBus Adapter
  vendor_name: SPAN
  model: MLO_48
  wifi_link: true
  ethernet_link: true
  # The reference panel publishes no SSID, as a panel on Ethernet may not.
  wifi_ssid: null
  # The commissioned site this variant publishes on the panel's info node. Synthetic.
  site:
    name: Sim MLO 48 Tandems
    address_lines: 100 Example Street
    locality: Example City
    region: CA
  off_grid_import_limit_enablement: UNCONFIGURED
  operator_import_limit_enablement: UNCONFIGURED
  unvalued: [pcs/operator-import-limit]
# SPAN release 202639, as the reference panel publishes it. Hardware 3.0 selects the
# `span-alpha-test-b2` variant: the site, commissioning facts and shared-with lists.
firmware_version: spanos3/r202639/03
hardware_version: '3.0'

